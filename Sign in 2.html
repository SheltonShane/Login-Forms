<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#d5dae2;--card:#eef0f3;--text:#16181d;--muted:#6b7280;--line:#c3c8d0;--accent:#c98a68;--btn:#16181d;--btn-ink:#f1f3f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c0f;--card:#181b21;--text:#eef0f4;--muted:#9aa1ad;--line:#3a3f48;--btn:#eef0f4;--btn-ink:#111317}}
:root[data-theme="dark"]{--bg:#0b0c0f;--card:#181b21;--text:#eef0f4;--muted:#9aa1ad;--line:#3a3f48;--btn:#eef0f4;--btn-ink:#111317}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:32px;background:var(--bg);color:var(--text);font-family:'Jura','Trebuchet MS',sans-serif}
.wrap{display:grid;grid-template-columns:1.1fr 1fr;width:min(100%,1000px);min-height:620px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(20,25,35,.22)}
.art{position:relative;background:#eef0f3;overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 50%}
.cap{position:absolute;z-index:1;left:clamp(28px,5vw,56px);right:28px;bottom:clamp(28px,5vw,52px);margin:0;color:#16181d;font-weight:300;font-size:clamp(.85rem,1.4vw,1rem);line-height:1.5}
.side{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(28px,6vw,72px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem;margin-bottom:56px}
.brand svg{width:26px;height:26px;fill:var(--accent)}
h1{margin:0 0 40px;font-weight:300;font-size:2.8rem;letter-spacing:.01em}
.sub{margin:0 0 40px;color:var(--muted);font-size:.95rem}
form{max-width:380px;width:100%}
.field{display:flex;align-items:center;gap:12px;margin-bottom:24px;border-bottom:1px solid var(--line);transition:border-color .2s}
.field svg{flex:none;width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.field input{flex:1;min-width:0;padding:12px 0;background:none;border:0;color:var(--text);font:inherit;font-size:1rem;outline:0}
.field input::placeholder{color:var(--muted)}
.field:focus-within{border-color:var(--accent)}
.field:focus-within>svg{stroke:var(--accent)}
.eye{flex:none;background:none;border:0;padding:4px;cursor:pointer;display:grid}
.eye:hover svg,.eye:focus-visible svg{stroke:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 28px;font-size:.85rem}
.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{position:absolute;opacity:0}
.check span{width:17px;height:17px;border:1px solid var(--muted);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.check input:checked+span{background:var(--accent);border-color:var(--accent)}
.check input:checked+span::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
a{color:var(--text);text-decoration-color:var(--accent);text-underline-offset:4px}
.btn{width:100%;padding:14px;border:0;background:var(--btn);color:var(--btn-ink);font:600 .95rem 'Jura','Trebuchet MS',sans-serif;letter-spacing:.06em;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.88}
.eye:focus-visible,.btn:focus-visible,a:focus-visible,.check input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.msg{min-height:1.3em;margin:14px 0 0;font-size:.85rem;color:var(--accent)}
.foot{margin-top:28px;font-size:.85rem;color:var(--muted)}
@media (max-width:780px){
 body{padding:16px}.wrap{grid-template-columns:1fr;min-height:0;border-radius:16px}
 .art{height:36vh;min-height:240px}
 .cap{display:none}
 .art img{object-position:50% 40%}
 .side{padding:32px 28px 48px}
 .brand{margin-bottom:28px}
 h1{font-size:2.3rem}
 .sub{margin-bottom:28px}
}
</style>
</head>

  <h1>Sign in</h1>
  <form id="f" novalidate>
   <label class="field">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    <input id="u" name="username" type="text" placeholder="Username" autocomplete="username" required>
   </label>
   <label class="field">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="button" class="eye" id="eye" aria-label="Show password">
     <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
   </label>
   <div class="row">
    <label class="check"><input type="checkbox" checked><span></span>Keep me signed in</label>
    <a href="#forgot">Forgot password?</a>
   </div>
   <button class="btn" type="submit">Sign in</button>
   <p class="msg" id="msg" role="status"></p>
  </form>
 </main>
</div>
<script>
const p=document.getElementById('p'),eye=document.getElementById('eye'),msg=document.getElementById('msg'),u=document.getElementById('u');
eye.addEventListener('click',()=>{const show=p.type==='password';p.type=show?'text':'password';eye.setAttribute('aria-label',show?'Hide password':'Show password')});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();
 msg.textContent=(!u.value.trim()||!p.value)?'Enter your username and password.':'Signed in as '+u.value.trim()+'.'});
</script>
