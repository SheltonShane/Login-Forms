.form{position:relative;width:min(46%,380px);padding:9% 0 0 8%;min-width:290px}
h1{margin:0 0 34px;font-weight:300;font-size:2.4rem;letter-spacing:.02em}
.field{display:flex;align-items:center;gap:10px;margin-bottom:22px;border-bottom:1px solid var(--line);transition:border-color .2s}
.field svg{flex:none;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.field input{flex:1;min-width:0;padding:10px 0;background:none;border:0;color:var(--text);font:inherit;font-size:.95rem;outline:0}
.field input::placeholder{color:var(--muted)}
.field:focus-within{border-color:var(--accent)}
.field:focus-within>svg{stroke:var(--accent)}
.eye{flex:none;background:none;border:0;padding:4px;cursor:pointer;display:grid}
.eye svg{width:18px;height:18px}
.eye:hover svg,.eye:focus-visible svg{stroke:var(--accent)}
.eye:focus-visible,.btn:focus-visible,.check input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.check{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--text);margin:6px 0 22px;cursor:pointer}
.check input{position:absolute;opacity:0}
.check span{width:16px;height:16px;border:1px solid var(--accent);display:grid;place-items:center;flex:none}
.check input:checked+span{background:var(--accent)}
.check input:checked+span::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.btn{width:100%;padding:11px;border:0;background:var(--accent);color:var(--accent-ink);font:600 .8rem 'Jura','Trebuchet MS',sans-serif;letter-spacing:.12em;cursor:pointer;transition:filter .2s}
.btn:hover{filter:brightness(1.1)}
.msg{min-height:1.2em;margin:12px 0 0;font-size:.78rem;color:var(--accent)}
.brand{position:absolute;right:7%;bottom:8%;display:flex;align-items:center;gap:12px;color:var(--accent);font-size:.68rem;font-weight:600;letter-spacing:.06em;line-height:1.3}
.brand svg{width:40px;height:40px;fill:var(--accent)}
@media (max-width:640px){
 body{padding:0;align-items:stretch}
 .card{aspect-ratio:auto;min-height:100vh;box-shadow:none}
 .art{clip-path:polygon(0 0,100% 0,100% 100%,0 40%);height:260px;inset:0 0 auto 0}
 .form{width:100%;max-width:none;padding:210px 28px 100px;margin:0 auto}
 .brand{right:28px;bottom:24px}
}
</style>
</head>
<body>
<main class="card">
 <div class="art" role="img" aria-label="Bronze dotted wave on a black background"></div>
 <form class="form" id="f" novalidate>
  <h1>Sign in</h1>
  <label class="field">
   <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
   <input id="u" name="username" type="text" placeholder="Username" autocomplete="username" required>
  </label>
  <label class="field">
   <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
   <input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
   <button type="button" class="eye" id="eye" aria-label="Show password">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
   </button>
  </label>
  <label class="check"><input type="checkbox" checked><span></span>Keep me signed in</label>
  <button class="btn" type="submit">SIGN IN</button>
  <p class="msg" id="msg" role="status"></p>
 </form>
 <div class="brand">
  <svg viewBox="0 0 40 40" aria-hidden="true"><g id="r"><rect x="18.5" y="1" width="3" height="9" rx="1.5"/></g><use href="#r" transform="rotate(45 20 20)"/><use href="#r" transform="rotate(90 20 20)"/><use href="#r" transform="rotate(135 20 20)"/><use href="#r" transform="rotate(180 20 20)"/><use href="#r" transform="rotate(225 20 20)"/><use href="#r" transform="rotate(270 20 20)"/><use href="#r" transform="rotate(315 20 20)"/></svg>
  <span>NORTHLIGHT<br>STUDIO</span>
 </div>
</main>
<script>
const p=document.getElementById('p'),eye=document.getElementById('eye'),msg=document.getElementById('msg');
eye.addEventListener('click',()=>{const show=p.type==='password';p.type=show?'text':'password';eye.setAttribute('aria-label',show?'Hide password':'Show password')});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();
 msg.textContent=(!u.value.trim()||!p.value)?'Enter your username and password.':'Signed in as '+u.value.trim()+'.'});
</script>
</body>
</html>
