<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Coves Light is not on Google Fonts: it shows if installed, or if the font file sits next to this page */
    @font-face {
      font-family: "Coves Light";
      src: local("Coves Light"), local("Coves-Light"), local("CovesLight"),
           url("Coves-Light.woff2") format("woff2"), url("Coves-Light.otf") format("opentype"), url("Coves-Light.ttf") format("truetype");
      font-weight: 300 400;
      font-display: swap;
    }
    :root {
      --blue: #F5E8D3;
      --line: rgba(255, 255, 255, 0.25);
      --muted: #8a8a8a;
    }
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        radial-gradient(circle at 15% 25%, rgba(245, 232, 211, 0.30) 0, transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.28) 0, transparent 38%),
        radial-gradient(ellipse at 50% 20%, #8b8b8b 0%, #6a6a6a 45%, #4a4a4a 100%);
      background-attachment: fixed;
      color: #fff;
      font-family: "Raleway", "Segoe UI", Arial, sans-serif;
    }

    .card {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 980px;
      min-height: 600px;
      overflow: hidden;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(20, 20, 22, 0.72), rgba(0, 0, 0, 0.62));
      -webkit-backdrop-filter: blur(26px) saturate(160%);
      backdrop-filter: blur(26px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

              mask-image: linear-gradient(to right, #000 55%, transparent 100%);

    /* ---------- right form ---------- */
    .panel { display: flex; align-items: center; padding: 48px 56px 48px 8px; }
    .inner { width: 100%; max-width: 340px; margin: 0 auto; }

    h1 {
      position: relative;
      margin: 0 0 44px; padding-bottom: 18px;
      font-family: "Coves Light", "Raleway", sans-serif; font-size: 3.2rem; font-weight: 300;
      letter-spacing: 0.01em; line-height: 1.05;
      background: linear-gradient(180deg, #ffffff 30%, #E4CFAE 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    h1::after {
      content: ""; position: absolute; left: 2px; bottom: 0;
      width: 44px; height: 3px; border-radius: 3px;
      background: linear-gradient(90deg, #F5E8D3, #E4CFAE);
      box-shadow: 0 0 14px rgba(245, 232, 211, 0.55);
    }

    .field {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      height: 54px;
      margin-bottom: 18px; padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field svg { flex: none; width: 17px; height: 17px; fill: none; stroke: rgba(255, 255, 255, 0.6); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
    .field input {
      flex: 1; min-width: 0; height: 100%;
      border: 0; outline: 0; background: transparent;
      color: #fff; font: inherit; font-size: 0.92rem;
    }
    .field input::placeholder { color: rgba(255, 255, 255, 0.6); opacity: 1; }
    .field:focus-within { border-color: var(--blue); background: rgba(245, 232, 211, 0.08); box-shadow: 0 0 0 4px rgba(245, 232, 211, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
    .field:focus-within svg { stroke: var(--blue); }
    .field.filled svg { stroke: var(--blue); }

    .eye { flex: none; display: grid; place-items: center; width: 30px; height: 30px; margin-right: -8px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
    .eye svg { width: 18px; height: 18px; fill: none; stroke: rgba(255, 255, 255, 0.7); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
    .eye:hover svg { stroke: #fff; }
    .eye:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.55); outline-offset: 1px; }
    .eye .open { display: none; }
    .eye.on .open { display: block; }
    .eye.on .shut { display: none; }
    .message { min-height: 1.1em; margin: 0 0 4px; color: #ff7b7b; font-size: 0.78rem; text-align: left; }

    .login {
      display: block;
      width: 100%; height: 52px;
      margin: 22px 0 0;
      border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 14px;
      background: linear-gradient(180deg, #F5E8D3 0%, #E8D5B5 100%);
      color: #2a2218; font: inherit; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(245, 232, 211, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }
    .login:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 14px 32px rgba(245, 232, 211, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
    .login:active { transform: translateY(0); filter: brightness(0.97); }
    .login:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.45); outline-offset: 3px; }



    /* ---------- mobile ---------- */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .card { background: rgba(10, 10, 12, 0.95); }
    }
    @media (max-width: 820px) {
      .card { grid-template-columns: 1fr; max-width: 480px; min-height: 0; }
      .art { min-height: 200px; height: 200px; }
      .panel { padding: 32px 24px 40px; }
      h1 { margin-bottom: 28px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="card">

    <section class="art" aria-hidden="true">
    </section>

    <section class="panel">
      <div class="inner">
        <h1>Sign in</h1>

        <form id="login-form" novalidate>
          <label class="field" for="username">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.400 3.600-7 8-7s8 2.600 8 7"/></svg>
            <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
          </label>

          <label class="field" for="password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 3 3m-6 0 2 2"/></svg>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
            <button type="button" class="eye" id="toggle" aria-label="Show password" aria-pressed="false">
              <svg class="shut" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              <svg class="open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </label>

          <p class="message" id="message" role="status" aria-live="polite"></p>

          <button type="submit" class="login">Login</button>
        </form>
</div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const message = document.querySelector("#message");

    form.querySelectorAll(".field input").forEach((input) => {
      input.addEventListener("input", () => input.closest(".field").classList.toggle("filled", input.value !== ""));
    });

    const eye = document.querySelector("#toggle");
    eye.addEventListener("click", (e) => {
      e.preventDefault();
      const input = form.elements.password;
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      eye.classList.toggle("on", show);
      eye.setAttribute("aria-pressed", String(show));
      eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
      input.focus();
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const username = form.elements.username.value.trim();
      const password = form.elements.password.value;

      if (!username || !password) { message.textContent = "Enter your username and password."; return; }
      message.textContent = "";

      // TODO: send the credentials to your backend, e.g.
      // fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      //   body: JSON.stringify({ username, password }) })
    });
  </script>
</body>
</html>
